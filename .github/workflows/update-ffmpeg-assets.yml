name: Update mirrored FFmpeg assets

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Mirror all six existing RID sources before enabling normal scheduled updates.'
        required: false
        default: false
        type: boolean

# This workflow never pushes to main. The default token is read-only except in
# the mirror job, where it publishes a same-repository non-Latest release. The
# administration-read secret is used only to fail closed on immutable settings.
permissions:
  contents: read

env:
  MANIFEST_BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  discover:
    name: Discover fixed upstream candidate
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    outputs:
      no_op: ${{ steps.candidate.outputs.no_op }}
      matrix: ${{ steps.candidate.outputs.matrix }}
      mirror_tag: ${{ steps.candidate.outputs.mirror_tag }}
      manifest_base: ${{ steps.authority.outputs.manifest_base }}
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Install Python
        uses: $/.github/actions/setup-python
        with:
          python-version-file: .python-version
      - name: Verify updater branch authority
        id: authority
        shell: bash
        run: |
          python script/ffmpeg-assets.py validate-workflow-authority \
            --ref-type "$GITHUB_REF_TYPE" \
            --ref-name "$GITHUB_REF_NAME" \
            --manifest-base "$MANIFEST_BASE_BRANCH"
          echo "manifest_base=$MANIFEST_BASE_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Discover complete fixed releases through GitHub APIs
        id: candidate
        shell: bash
        run: |
          bootstrap_args=()
          if [[ "${{ inputs.bootstrap }}" == "true" ]]; then
            bootstrap_args+=(--bootstrap)
          fi
          mkdir -p .ffmpeg-update
          python script/ffmpeg-assets.py discover \
            --manifest script/assets/external-assets.json \
            --output .ffmpeg-update/candidates.json \
            "${bootstrap_args[@]}"
          python script/ffmpeg-assets.py workflow-output \
            --candidates .ffmpeg-update/candidates.json \
            --linux-x64-runner '${{ vars.UBUNTU_X64_RUNNER }}' >> "$GITHUB_OUTPUT"
      - name: Upload candidate metadata
        if: steps.candidate.outputs.no_op != 'true'
        uses: $/.github/actions/upload-artifact
        with:
          name: ffmpeg-candidate
          path: .ffmpeg-update/candidates.json
          if-no-files-found: error

  validate:
    name: Validate ${{ matrix.rid }} candidate
    needs: discover
    if: needs.discover.outputs.no_op != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
      - name: Install Python
        uses: $/.github/actions/setup-python
        with:
          python-version-file: .python-version
      - name: Download candidate metadata
        uses: $/.github/actions/download-artifact
        with:
          name: ffmpeg-candidate
          path: .ffmpeg-update
      - name: Download, verify and validate candidate archive
        shell: bash
        run: |
          mkdir -p .ffmpeg-update/${{ matrix.rid }}
          python script/ffmpeg-assets.py download-candidate \
            --candidates .ffmpeg-update/candidates.json \
            --rid '${{ matrix.rid }}' \
            --destination .ffmpeg-update/${{ matrix.rid }}
          arguments=(
            validate-candidate
            --candidates .ffmpeg-update/candidates.json
            --rid '${{ matrix.rid }}'
            --directory .ffmpeg-update/${{ matrix.rid }}
            --execute
          )
          if [[ -n '${{ matrix.requiredEncoder }}' ]]; then
            arguments+=(--required-encoder '${{ matrix.requiredEncoder }}')
          fi
          python script/ffmpeg-assets.py "${arguments[@]}"

  mirror-and-pr:
    name: Mirror validated candidate and open PR
    needs: [discover, validate]
    if: needs.discover.outputs.no_op != 'true'
    runs-on: ${{ vars.UBUNTU_X64_RUNNER }}
    permissions:
      contents: write
    env:
      MIRROR_REPOSITORY: ${{ github.repository }}
      DOWNKYI_AUTOMATION_TOKEN: ${{ secrets.DOWNKYI_AUTOMATION_TOKEN }}
    steps:
      - name: Checkout
        uses: $/.github/actions/checkout
        with:
          persist-credentials: false
      - name: Install Python
        uses: $/.github/actions/setup-python
        with:
          python-version-file: .python-version
      - name: Download candidate metadata
        uses: $/.github/actions/download-artifact
        with:
          name: ffmpeg-candidate
          path: .ffmpeg-update
      - name: Download the already validated fixed candidate again and verify SHA-256
        shell: bash
        run: |
          mkdir -p .ffmpeg-update/mirror
          while IFS= read -r rid; do
            python script/ffmpeg-assets.py download-candidate \
              --candidates .ffmpeg-update/candidates.json \
              --rid "$rid" \
              --destination .ffmpeg-update/mirror
          done < <(python -c 'import json; print("\n".join(json.load(open(".ffmpeg-update/candidates.json"))["assets"]))')
          python script/ffmpeg-assets.py record-downloaded-sizes \
            --candidates .ffmpeg-update/candidates.json \
            --directory .ffmpeg-update/mirror
      - name: Create a new immutable mirror release or resume exact immutable evidence
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo 'The job-scoped GITHUB_TOKEN is required to publish the same-repository mirror release.' >&2
            exit 1
          fi
          previous_latest_tag=$(GH_TOKEN="$RELEASE_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$MIRROR_REPOSITORY/releases/latest" \
            --jq '.tag_name')
          if GH_TOKEN="$RELEASE_TOKEN" gh release view '${{ needs.discover.outputs.mirror_tag }}' --repo "$MIRROR_REPOSITORY" >/dev/null 2>&1; then
            echo 'An existing release will not be modified; exact immutable asset read-back is required before manifest mutation.'
          else
            GH_TOKEN="$RELEASE_TOKEN" gh release create '${{ needs.discover.outputs.mirror_tag }}' \
              --repo "$MIRROR_REPOSITORY" \
              --title 'DownKyi FFmpeg ${{ needs.discover.outputs.mirror_tag }}' \
              --notes-file .ffmpeg-update/candidates.json \
              --draft \
              --prerelease \
              --latest=false
            GH_TOKEN="$RELEASE_TOKEN" gh release upload '${{ needs.discover.outputs.mirror_tag }}' .ffmpeg-update/mirror/* \
              --repo "$MIRROR_REPOSITORY"
            GH_TOKEN="$RELEASE_TOKEN" gh release edit '${{ needs.discover.outputs.mirror_tag }}' \
              --repo "$MIRROR_REPOSITORY" \
              --draft=false \
              --prerelease \
              --latest=false
          fi
          current_latest_tag=$(GH_TOKEN="$RELEASE_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$MIRROR_REPOSITORY/releases/latest" \
            --jq '.tag_name')
          if [[ "$current_latest_tag" != "$previous_latest_tag" ]]; then
            echo "Mirror publication changed Latest from $previous_latest_tag to $current_latest_tag." >&2
            exit 1
          fi
      - name: Read back immutable mirror release evidence and update the manifest in the PR workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_version=$(python -c 'import json; print(json.load(open("script/assets/external-assets.json"))["ffmpeg"]["version"])')
          python script/ffmpeg-assets.py read-mirror-evidence \
            --candidates .ffmpeg-update/candidates.json \
            --repository "$MIRROR_REPOSITORY" \
            --tag '${{ needs.discover.outputs.mirror_tag }}' \
            --output .ffmpeg-update/mirror-result.json
          python script/ffmpeg-assets.py apply-update \
            --manifest script/assets/external-assets.json \
            --candidates .ffmpeg-update/candidates.json \
            --mirror .ffmpeg-update/mirror-result.json
          python script/ffmpeg-assets.py validate-manifest --manifest script/assets/external-assets.json
          python script/ffmpeg-assets.py preflight --manifest script/assets/external-assets.json --timeout 30
          python script/ffmpeg-assets.py pr-body \
            --candidates .ffmpeg-update/candidates.json \
            --mirror .ffmpeg-update/mirror-result.json \
            --previous-version "$previous_version" \
            --output .ffmpeg-update/pr-body.md
      - name: Create manifest pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DOWNKYI_AUTOMATION_TOKEN }}
          add-paths: script/assets/external-assets.json
          commit-message: "build(deps): update mirrored FFmpeg to ${{ needs.discover.outputs.mirror_tag }}"
          branch: automation/ffmpeg-${{ needs.discover.outputs.mirror_tag }}
          base: ${{ needs.discover.outputs.manifest_base }}
          delete-branch: true
          title: "build(deps): update mirrored FFmpeg to ${{ needs.discover.outputs.mirror_tag }}"
          body-path: .ffmpeg-update/pr-body.md
      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.DOWNKYI_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --merge --repo "$GITHUB_REPOSITORY"
